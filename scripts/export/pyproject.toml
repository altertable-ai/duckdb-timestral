[project]
name = "timestral-export"
version = "1.0.0"
description = "Exports Timestral checkpoints to ONNX for the timestral DuckDB extension"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "onnxscript==0.7.2",
    "timestral @ git+https://github.com/mistralai/timestral@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
    "torch==2.14.1",
]

[tool.uv]
package = false
